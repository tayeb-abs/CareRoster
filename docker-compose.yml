services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: careroster
      POSTGRES_USER: careroster
      POSTGRES_PASSWORD: careroster_dev_password
    ports:
      - "5432:5432"
    volumes:
      - careroster-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careroster -d careroster"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  careroster-postgres-data:
